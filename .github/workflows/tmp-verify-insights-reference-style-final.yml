name: Verify final Insight reference styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verify-insights-reference-style-final.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live web print and PDF references
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mkdir -p qa-final-reference-style
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const BASE='https://shorevest.com';
          const VERSION='20260911-references-4';
          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!chrome) throw new Error('Chrome not found');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const die=m=>{throw new Error(m)};
          const px=s=>Number.parseFloat(s||'0');

          async function waitLive(page){
            const until=Date.now()+300000;
            while(Date.now()<until){
              await page.goto(`${BASE}/insights/china-debt-dynamics/v9i3/?qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>document.body?.dataset?.cddReady==='true',null,{timeout:30000}).catch(()=>{});
              const v=await page.evaluate(()=>window.__CDD_CITATIONS_VERSION||'');
              if(v===VERSION)return;
              console.log('Waiting for live refs4; current=',v);
              await sleep(12000);
            }
            die('refs4 never became live');
          }

          async function check(page, issue, media, width){
            await page.setViewportSize({width,height:media==='print'?1200:(width<600?844:1000)});
            await page.emulateMedia({media});
            const src=`assets/data/china-debt-dynamics-${issue}.json`;
            const url=media==='print'
              ? `${BASE}/insights/china-debt-dynamics/print/?source=${encodeURIComponent(src)}&qa=${Date.now()}`
              : `${BASE}/insights/china-debt-dynamics/${issue}/?qa=${Date.now()}`;
            const r=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            if(!r||r.status()>=400)die(`${issue} ${media}: HTTP ${r?.status()}`);
            await page.waitForFunction(()=>document.body?.dataset?.cddReady==='true',null,{timeout:30000});
            const a=await page.evaluate(()=>{
              const h=document.querySelector('.cdd-sources-heading');
              const hs=h?getComputedStyle(h):null;
              const hb=h?getComputedStyle(h,'::before'):null;
              const ha=h?getComputedStyle(h,'::after'):null;
              const list=document.querySelector('.cdd-sources-list');
              const ls=list?getComputedStyle(list):null;
              const notes=[...document.querySelectorAll('.cdd-source-note')];
              const n=notes[0]; const ns=n?getComputedStyle(n):null; const np=n?getComputedStyle(n,'::before'):null;
              const ix=n?.querySelector('.cdd-source-note__index'); const cp=n?.querySelector('.cdd-source-note__copy');
              const is=ix?getComputedStyle(ix):null;
              const ir=ix?.getBoundingClientRect(); const cr=cp?.getBoundingClientRect();
              return {
                version:window.__CDD_CITATIONS_VERSION||'', heading:h?.textContent.trim()||'', notes:notes.length,
                hBorderLeft:hs?.borderLeftWidth||'', hBorderTop:hs?.borderTopWidth||'', hBg:hs?.backgroundColor||'', hPaddingLeft:hs?.paddingLeft||'',
                hBefore:hb?.display||'', hBeforeContent:hb?.content||'', hAfter:ha?.display||'', hAfterContent:ha?.content||'',
                listBorderTop:ls?.borderTopWidth||'',
                noteDisplay:ns?.display||'', noteCols:ns?.gridTemplateColumns||'', noteGap:ns?.columnGap||'',
                noteFont:ns?.fontSize||'', noteLine:ns?.lineHeight||'', breakInside:ns?.breakInside||'',
                bulletDisplay:np?.display||'', bulletContent:np?.content||'',
                index:ix?.textContent.trim()||'', indexColor:is?.color||'', indexWeight:is?.fontWeight||'',
                indexRight:ir?.right||0, copyLeft:cr?.left||0,
                brackets:[...document.querySelectorAll('.cdd-inline-citation,.cdd-source-note__index')].some(x=>/[\[\]]/.test(x.textContent)),
                sw:document.documentElement.scrollWidth, iw:innerWidth
              };
            });
            console.log(issue,media,width,JSON.stringify(a));
            if(a.version!==VERSION)die(`${issue} ${media}: ${a.version}`);
            if(!a.heading||!a.notes)die(`${issue} ${media}: missing source section`);
            if(a.hBorderLeft!=='0px')die(`${issue} ${media}: decorative heading left border remains (${a.hBorderLeft})`);
            if(a.hPaddingLeft!=='0px')die(`${issue} ${media}: heading left padding remains (${a.hPaddingLeft})`);
            if(px(a.hBorderTop)<0.5)die(`${issue} ${media}: missing quiet separator above Sources and Notes`);
            if(px(a.listBorderTop)<0.5)die(`${issue} ${media}: missing reference-list rule`);
            if(a.hBefore!=='none' && !['none','normal'].includes(a.hBeforeContent))die(`${issue}: heading before decoration remains`);
            if(a.hAfter!=='none' && !['none','normal'].includes(a.hAfterContent))die(`${issue}: heading after decoration remains`);
            if(a.noteDisplay!=='grid'||!(a.copyLeft>a.indexRight))die(`${issue} ${media}: number alignment failed`);
            if(a.bulletDisplay!=='none' && !['none','normal'].includes(a.bulletContent))die(`${issue} ${media}: bullet remains`);
            if(a.indexColor==='rgb(201, 59, 42)')die(`${issue} ${media}: reference number is still cinnabar`);
            if(a.brackets)die(`${issue} ${media}: brackets remain`);
            if(a.sw>a.iw+3)die(`${issue} ${media}: overflow ${a.sw}/${a.iw}`);
            if(media==='print' && !['avoid','avoid-page'].includes(a.breakInside))die(`${issue}: print note may split`);

            const cols=px(a.noteCols); const gap=px(a.noteGap); const font=px(a.noteFont);
            if(media==='screen' && width>=700){
              if(cols<27||cols>35||gap<6||gap>10||font<14.5||font>16.5)die(`${issue} desktop: noncanonical note geometry ${a.noteCols}/${a.noteGap}/${a.noteFont}`);
            } else if(media==='screen') {
              if(cols<24||cols>31||gap<5||gap>9||font<13.5||font>15.5)die(`${issue} mobile: noncanonical note geometry ${a.noteCols}/${a.noteGap}/${a.noteFont}`);
            } else {
              if(cols<22||cols>29||gap<4||gap>8||font<11.5||font>13.5)die(`${issue} print: noncanonical note geometry ${a.noteCols}/${a.noteGap}/${a.noteFont}`);
            }

            await page.locator('.cdd-sources-heading').scrollIntoViewIfNeeded();
            await page.screenshot({path:`qa-final-reference-style/${issue}-${media}-${width}.png`,fullPage:false});
            if(media==='print'){
              const pdf=await page.pdf({path:`qa-final-reference-style/${issue}.pdf`,format:'A4',printBackground:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
              if(pdf.length<10000)die(`${issue}: PDF too small`);
            }
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
            const page=await browser.newPage();
            await page.addInitScript(()=>{window.print=()=>{}});
            await waitLive(page);
            for(const issue of ['v9i3','v10i3']){
              await check(page,issue,'screen',1440);
              await check(page,issue,'screen',390);
              await check(page,issue,'print',900);
            }

            // Archive-wide check: any issue that actually contains numbered source notes
            // must receive the same canonical treatment; issues without them are left alone.
            const issues=fs.readdirSync('insights/china-debt-dynamics',{withFileTypes:true})
              .filter(d=>d.isDirectory()&&/^v\d+i\d+$/i.test(d.name)).map(d=>d.name);
            const styled=[];
            await page.emulateMedia({media:'screen'});
            await page.setViewportSize({width:1200,height:900});
            for(const issue of issues){
              await page.goto(`${BASE}/insights/china-debt-dynamics/${issue}/?qa=${Date.now()}-${issue}`,{waitUntil:'networkidle',timeout:60000});
              await page.waitForFunction(()=>document.body?.dataset?.cddReady==='true',null,{timeout:30000});
              const a=await page.evaluate(()=>{
                const notes=[...document.querySelectorAll('.cdd-source-note')];
                return {
                  version:window.__CDD_CITATIONS_VERSION||'',
                  notes:notes.length,
                  bad:notes.filter(n=>{
                    const s=getComputedStyle(n), p=getComputedStyle(n,'::before');
                    const ix=n.querySelector('.cdd-source-note__index'), cp=n.querySelector('.cdd-source-note__copy');
                    return s.display!=='grid'||!ix||!cp||(p.display!=='none'&&!['none','normal'].includes(p.content));
                  }).length,
                  brackets:[...document.querySelectorAll('.cdd-inline-citation,.cdd-source-note__index')].some(x=>/[\[\]]/.test(x.textContent)),
                  overflow:document.documentElement.scrollWidth>innerWidth+3
                };
              });
              if(a.version!==VERSION)die(`${issue}: shared reference version mismatch`);
              if(a.notes){styled.push(issue);if(a.bad||a.brackets||a.overflow)die(`${issue}: archive reference QA failed ${JSON.stringify(a)}`);}
            }
            console.log(`ARCHIVE PASS: standardized numbered references found on ${styled.join(', ')||'no issues'}; all 22 issue routes checked.`);
            console.log('PASS: canonical shared reference treatment live across desktop, mobile, print and generated PDFs');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insight-reference-style-final-v4
          path: qa-final-reference-style
          if-no-files-found: ignore

# Temporary workflow used only for this final live verification pass.
