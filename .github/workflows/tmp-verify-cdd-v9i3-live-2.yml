name: Fresh live CDD v9i3 verification

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm repaired public route is live
        shell: bash
        run: |
          set -euo pipefail
          url="https://shorevest.com/insights/china-debt-dynamics/print/?source=assets/data/china-debt-dynamics-v9i3.json&t=${GITHUB_SHA}"
          for i in $(seq 1 30); do
            html="$(curl -fsSL --retry 2 --connect-timeout 10 "$url" || true)"
            if printf '%s' "$html" | grep -Fq 'cdd-v9i3-figure-fit.css?v=20260911-v9i3-fit-2' && \
               printf '%s' "$html" | grep -Fq 'cdd-article-template.js?v=20260911-print-figures-1'; then
              echo "PASS: repaired CSS and renderer are live on shorevest.com"
              exit 0
            fi
            echo "Attempt $i: waiting for GitHub Pages..."
            sleep 10
          done
          echo "FAIL: repaired public route did not become live in time" >&2
          exit 1
      - name: Measure all five live v9i3 figures
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = [
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser'
          ].find(fs.existsSync);
          if (!executablePath) throw new Error('Chrome/Chromium not found');

          const rect = r => ({left:r.left,right:r.right,width:r.width,top:r.top,bottom:r.bottom,height:r.height});

          function validate(label, m) {
            const tol = 1.5;
            const failures = [];
            if (!String(m.source || '').includes('china-debt-dynamics-v9i3')) failures.push(`wrong source: ${m.source}`);
            if (m.figures.length !== 5) failures.push(`expected 5 figures, found ${m.figures.length}`);
            for (const f of m.figures) {
              const name = f.src.split('/').pop();
              const tag = `figure ${f.index + 1} ${name}`;
              if (f.loading !== 'eager') failures.push(`${tag}: loading=${f.loading}`);
              if (!(f.naturalWidth > 0 && f.naturalHeight > 0)) failures.push(`${tag}: image not loaded`);
              if (f.figure.left < m.body.left - tol) failures.push(`${tag}: figure left outside body by ${(m.body.left-f.figure.left).toFixed(2)}px`);
              if (f.figure.right > m.body.right + tol) failures.push(`${tag}: figure right outside body by ${(f.figure.right-m.body.right).toFixed(2)}px`);
              if (f.image.left < f.media.left - tol) failures.push(`${tag}: image left outside media by ${(f.media.left-f.image.left).toFixed(2)}px`);
              if (f.image.right > f.media.right + tol) failures.push(`${tag}: image right outside media by ${(f.image.right-f.media.right).toFixed(2)}px`);
              if (f.image.width > f.media.width + tol) failures.push(`${tag}: image ${f.image.width.toFixed(2)}px > media ${f.media.width.toFixed(2)}px`);
              if (f.figureBoxSizing !== 'border-box') failures.push(`${tag}: figure box-sizing=${f.figureBoxSizing}`);
              if (f.imageObjectFit !== 'contain') failures.push(`${tag}: object-fit=${f.imageObjectFit}`);
            }
            console.log(`${label} GEOMETRY`);
            console.log(JSON.stringify(m, null, 2));
            if (failures.length) throw new Error(`${label} FAILED: ${failures.join('; ')}`);
            console.log(`PASS: ${label} - all five figures contained`);
          }

          (async () => {
            const browser = await chromium.launch({headless:true, executablePath, args:['--no-sandbox']});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            await page.addInitScript(() => { window.print = () => {}; });
            const url = `https://shorevest.com/insights/china-debt-dynamics/print/?source=assets/data/china-debt-dynamics-v9i3.json&t=${Date.now()}`;
            await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForFunction(() => {
              const imgs = [...document.querySelectorAll('.cdd-figure img')];
              return imgs.length === 5 && imgs.every(img => img.loading === 'eager' && img.complete && img.naturalWidth > 0);
            }, null, {timeout:60000});
            await page.evaluate(async () => {
              await Promise.all([...document.querySelectorAll('.cdd-figure img')].map(img => img.decode ? img.decode().catch(()=>{}) : Promise.resolve()));
            });

            async function measure() {
              return page.evaluate(() => {
                const shell = document.querySelector('.cdd-print-shell');
                const body = document.querySelector('.cdd-body');
                const box = el => {
                  const r = el.getBoundingClientRect();
                  return {left:r.left,right:r.right,width:r.width,top:r.top,bottom:r.bottom,height:r.height};
                };
                const figures = [...document.querySelectorAll('.cdd-figure')].map((figure,index) => {
                  const media = figure.querySelector('.cdd-figure__media') || figure;
                  const img = figure.querySelector('img');
                  return {
                    index,
                    src: img.currentSrc || img.src || '',
                    loading: img.loading,
                    figure: box(figure),
                    media: box(media),
                    image: box(img),
                    naturalWidth: img.naturalWidth,
                    naturalHeight: img.naturalHeight,
                    figureBoxSizing: getComputedStyle(figure).boxSizing,
                    imageObjectFit: getComputedStyle(img).objectFit
                  };
                });
                return {source:document.body.dataset.articleSource,shell:box(shell),body:box(body),figures};
              });
            }

            validate('SCREEN', await measure());
            await page.emulateMedia({media:'print'});
            validate('PRINT', await measure());
            console.log('PASS: LIVE SHOREVEST V9I3 ALL FIGURES VERIFIED');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
