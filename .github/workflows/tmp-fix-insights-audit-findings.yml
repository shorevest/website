name: Fix Insights audit findings

on:
  push:
    branches: [fix/insights-full-audit-20260911]
    paths:
      - '.github/workflows/tmp-fix-insights-audit-findings.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical CDD mappings and legacy aliases
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          def read(rel): return (root / rel).read_text(encoding='utf-8')
          def write(rel, text):
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          # Correct canonical JSON names for the historically renumbered 2024 issues.
          v8i1 = read('assets/data/china-debt-dynamics-v8i1.json')
          v8i3_old = read('assets/data/china-debt-dynamics-v8i3.json')
          v8i5_old = read('assets/data/china-debt-dynamics-v8i5.json')
          write('assets/data/china-debt-dynamics-v8i6.json', v8i5_old)
          write('assets/data/china-debt-dynamics-v8i5.json', v8i3_old)
          write('assets/data/china-debt-dynamics-v8i3.json', v8i1)

          source_swaps = {
              'china-debt-dynamics-v8i1.html': ('china-debt-dynamics-v8i1.json', 'china-debt-dynamics-v8i3.json'),
              'china-debt-dynamics-v8i3.html': ('china-debt-dynamics-v8i3.json', 'china-debt-dynamics-v8i5.json'),
              'china-debt-dynamics-v8i5.html': ('china-debt-dynamics-v8i5.json', 'china-debt-dynamics-v8i6.json'),
              'insights/china-debt-dynamics/v8i3/index.html': ('china-debt-dynamics-v8i1.json', 'china-debt-dynamics-v8i3.json'),
              'insights/china-debt-dynamics/v8i5/index.html': ('china-debt-dynamics-v8i3.json', 'china-debt-dynamics-v8i5.json'),
              'insights/china-debt-dynamics/v8i6/index.html': ('china-debt-dynamics-v8i5.json', 'china-debt-dynamics-v8i6.json'),
          }
          for rel, (old, new) in source_swaps.items():
              text = read(rel)
              if old not in text: raise SystemExit(f'{rel}: expected {old} not found')
              write(rel, text.replace(old, new))

          # Keep every archive PDF button tied to the article's canonical JSON source.
          for rel in ['insights.html', 'insights/index.html', 'insights_cn.html', 'cn/insights/index.html']:
              text = read(rel)
              for old, tmp in {
                  'source=assets/data/china-debt-dynamics-v8i1.json': 'source=assets/data/china-debt-dynamics-__V8I3__.json',
                  'source=assets/data/china-debt-dynamics-v8i3.json': 'source=assets/data/china-debt-dynamics-__V8I5__.json',
                  'source=assets/data/china-debt-dynamics-v8i5.json': 'source=assets/data/china-debt-dynamics-__V8I6__.json',
              }.items(): text = text.replace(old, tmp)
              text = (text
                  .replace('china-debt-dynamics-__V8I3__.json', 'china-debt-dynamics-v8i3.json')
                  .replace('china-debt-dynamics-__V8I5__.json', 'china-debt-dynamics-v8i5.json')
                  .replace('china-debt-dynamics-__V8I6__.json', 'china-debt-dynamics-v8i6.json'))
              text = text.replace(
                  'href="assets/pdfs/china-debt-dynamics-47-high-private-credit-returns-low-rate-environment.pdf"',
                  'href="/insights/china-debt-dynamics/print/?source=assets/data/china-debt-dynamics-v10i2.json&amp;pdf=1"'
              )
              write(rel, text)

          # Compatibility aliases for corrected issue IDs that otherwise 404 at old-style URLs.
          def alias_html(issue, title):
              target = f'/insights/china-debt-dynamics/{issue}/'
              return f'''<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>{title} | ShoreVest</title>\n  <meta name="robots" content="noindex, follow">\n  <link rel="canonical" href="https://shorevest.com{target}">\n  <meta http-equiv="refresh" content="0; url={target}">\n  <script>location.replace('{target}' + location.search + location.hash);</script>\n</head>\n<body><p><a href="{target}">Continue to the ShoreVest Insight</a></p></body>\n</html>\n'''
          write('china-debt-dynamics-v8i6.html', alias_html('v8i6', 'United States of China'))
          write('china-debt-dynamics-v9i4.html', alias_html('v9i4', "Beijing’s Campaign Against Overcapacity Creates Private Credit Opportunities"))

          # Keep compatibility aliases out of clean-route source selection.
          rel = 'scripts/generate-clean-public-urls.js'
          text = read(rel)
          marker = 'function routeForSource(source) {\n'
          guard = "function routeForSource(source) {\n  if (source === 'china-debt-dynamics-v8i6.html' || source === 'china-debt-dynamics-v9i4.html') return null;\n"
          if guard not in text:
              if marker not in text: raise SystemExit('routeForSource marker not found')
              text = text.replace(marker, guard, 1)
          write(rel, text)
          PY

          git config user.name "shorevest-site-bot"
          git config user.email "shorevest-site-bot@users.noreply.github.com"
          git add \
            assets/data/china-debt-dynamics-v8i3.json \
            assets/data/china-debt-dynamics-v8i5.json \
            assets/data/china-debt-dynamics-v8i6.json \
            china-debt-dynamics-v8i1.html \
            china-debt-dynamics-v8i3.html \
            china-debt-dynamics-v8i5.html \
            china-debt-dynamics-v8i6.html \
            china-debt-dynamics-v9i4.html \
            insights.html insights/index.html insights_cn.html cn/insights/index.html \
            insights/china-debt-dynamics/v8i3/index.html \
            insights/china-debt-dynamics/v8i5/index.html \
            insights/china-debt-dynamics/v8i6/index.html \
            scripts/generate-clean-public-urls.js
          git diff --check --cached
          git commit -m "Fix Insights canonical PDF mappings and legacy routes"
          git push origin HEAD:fix/insights-full-audit-20260911
