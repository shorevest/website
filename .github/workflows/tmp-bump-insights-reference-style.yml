name: Bump Insight reference style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-bump-insights-reference-style.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump shared citation asset version
        shell: bash
        run: |
          set -euo pipefail
          old='20260911-superscript-1'
          new='20260911-references-2'
          files=(
            assets/js/cdd-citations.js
            assets/js/cdd-issue-pager.js
            assets/js/cdd-article-template.js
          )
          for f in "${files[@]}"; do
            sed -i "s/${old}/${new}/g" "$f"
          done
          grep -R "${new}" "${files[@]}"
          if grep -R "${old}" "${files[@]}"; then
            echo 'Old citation asset version still present' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Bump standardized Insight reference style'
          git push origin HEAD:main
