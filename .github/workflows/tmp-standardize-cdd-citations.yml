name: Standardize CDD citations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-standardize-cdd-citations.yml'

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply shared citation standard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          VERSION = '20260911-superscript-1'
          root = Path('.')

          citations_js = r'''/* China Debt Dynamics citation treatment.
           * Manuscript markers such as [7], [1][2] or [1, 2] are rendered as
           * clean linked superscript numerals and tied to Sources and Notes.
           */
          (function () {
            'use strict';

            var VERSION = '20260911-superscript-1';
            var STYLE_URL = '/assets/css/cdd-citations.css?v=' + VERSION;
            var observer = null;
            var scheduled = false;

            window.__CDD_CITATIONS_VERSION = VERSION;

            function withToken(url) {
              if (typeof window.__svTok === 'function') return window.__svTok(url);
              var token = window.__SVT || '';
              if (!token) return url;
              return url + (url.indexOf('?') > -1 ? '&' : '?') + 't=' + encodeURIComponent(token);
            }

            function installStyles() {
              var desired = withToken(STYLE_URL);
              var link = document.querySelector('link[data-cdd-citation-styles]');
              if (link) {
                if (link.href.indexOf('v=' + VERSION) === -1) link.href = desired;
                return link;
              }
              link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = desired;
              link.setAttribute('data-cdd-citation-styles', 'true');
              document.head.appendChild(link);
              return link;
            }

            function sourceNumber(entry) {
              if (!entry) return '';
              if (entry.dataset && entry.dataset.cddSourceNumber) return entry.dataset.cddSourceNumber;

              var index = entry.querySelector && entry.querySelector('.cdd-source-note__index');
              var text = index ? index.textContent : entry.textContent;
              var match = String(text || '').trim().match(/^\[?(\d+)\]?[.)]?/);
              return match ? match[1] : '';
            }

            function sourceCopy(entry, number) {
              var copy = entry.querySelector && entry.querySelector('.cdd-source-note__copy');
              if (copy) return copy.textContent.trim();
              return String(entry.textContent || '')
                .replace(new RegExp('^\\s*(?:\\[' + number + '\\]|' + number + '[.)]?)\\s*'), '')
                .trim();
            }

            function shorten(text) {
              var clean = String(text || '').replace(/\s+/g, ' ').trim();
              return clean.length > 180 ? clean.slice(0, 177).trim() + '…' : clean;
            }

            function linkifySourceUrls(copy) {
              if (!copy || copy.querySelector('a[data-cdd-source-url]')) return;

              var text = copy.textContent || '';
              var pattern = /https?:\/\/[^\s]+/g;
              var match;
              var cursor = 0;
              var fragment = document.createDocumentFragment();
              var changed = false;

              while ((match = pattern.exec(text))) {
                fragment.appendChild(document.createTextNode(text.slice(cursor, match.index)));

                var href = match[0].replace(/[.,;)]+$/, '');
                var trailing = match[0].slice(href.length);
                var link = document.createElement('a');
                link.href = href;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.setAttribute('data-cdd-source-url', 'true');

                try {
                  var host = new URL(href).hostname.replace(/^www\./, '');
                  if (host.indexOf('savills') !== -1) link.textContent = 'Savills';
                  else if (host.indexOf('cbre') !== -1) link.textContent = 'CBRE';
                  else if (host.indexOf('jll') !== -1) link.textContent = 'JLL';
                  else link.textContent = 'Source';
                } catch (_) {
                  link.textContent = 'Source';
                }

                fragment.appendChild(link);
                if (trailing) fragment.appendChild(document.createTextNode(trailing));
                cursor = match.index + match[0].length;
                changed = true;
              }

              if (!changed) return;
              fragment.appendChild(document.createTextNode(text.slice(cursor)));
              copy.textContent = '';
              copy.appendChild(fragment);
            }

            function upgradeSourceEntry(entry) {
              var number = sourceNumber(entry);
              if (!number) return null;

              var copyText = sourceCopy(entry, number);
              var copy = entry.querySelector('.cdd-source-note__copy');
              var index = entry.querySelector('.cdd-source-note__index');

              if (!copy || !index) {
                entry.textContent = '';
                index = document.createElement('span');
                index.className = 'cdd-source-note__index';
                copy = document.createElement('span');
                copy.className = 'cdd-source-note__copy';
                copy.textContent = copyText;
                entry.append(index, copy);
              }

              entry.classList.add('cdd-source-note');
              entry.dataset.cddSourceNumber = number;
              entry.id = 'cdd-source-' + number;
              index.textContent = number + '.';
              linkifySourceUrls(copy);

              return {
                number: number,
                id: entry.id,
                title: shorten(copy.textContent)
              };
            }

            function collectSources(sourcesHeading) {
              var sources = {};
              var node = sourcesHeading.nextElementSibling;

              sourcesHeading.classList.add('cdd-sources-heading');

              while (node && node.tagName !== 'H2') {
                if (node.tagName === 'P') {
                  var paragraphSource = upgradeSourceEntry(node);
                  if (paragraphSource) sources[paragraphSource.number] = paragraphSource;
                } else if (node.tagName === 'UL' || node.tagName === 'OL') {
                  node.classList.add('cdd-sources-list');
                  node.setAttribute('aria-label', 'Sources and notes');
                  Array.from(node.children).forEach(function (entry, index) {
                    if (!sourceNumber(entry) && node.tagName === 'OL') {
                      entry.dataset.cddSourceNumber = String(index + 1);
                    }
                    var listSource = upgradeSourceEntry(entry);
                    if (listSource) sources[listSource.number] = listSource;
                  });
                }
                node = node.nextElementSibling;
              }

              return sources;
            }

            function eligibleTextNode(node) {
              if (!node || !node.nodeValue || node.nodeValue.indexOf('[') === -1) return false;
              var parent = node.parentElement;
              if (!parent) return false;
              return !parent.closest('a, sup, code, pre, script, style, .cdd-source-note');
            }

            function makeCitationGroup(numbers, sources) {
              var sup = document.createElement('sup');
              sup.className = 'cdd-inline-citation';

              numbers.forEach(function (number, index) {
                var source = sources[number];
                if (index) {
                  var separator = document.createElement('span');
                  separator.className = 'cdd-inline-citation__separator';
                  separator.textContent = ',';
                  separator.setAttribute('aria-hidden', 'true');
                  sup.appendChild(separator);
                }

                var link = document.createElement('a');
                link.href = '#' + source.id;
                link.textContent = source.number;
                link.setAttribute('aria-label', 'View source ' + source.number);
                link.setAttribute('data-cdd-citation', source.number);
                if (source.title) link.title = 'Source ' + source.number + ': ' + source.title;
                sup.appendChild(link);
              });

              return sup;
            }

            function replaceCitationMarkers(root, sources) {
              var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                acceptNode: function (node) {
                  return eligibleTextNode(node) && /\[\s*\d+/.test(node.nodeValue)
                    ? NodeFilter.FILTER_ACCEPT
                    : NodeFilter.FILTER_REJECT;
                }
              });

              var textNodes = [];
              while (walker.nextNode()) textNodes.push(walker.currentNode);

              textNodes.forEach(function (textNode) {
                var text = textNode.nodeValue;
                var pattern = /(?:\[(?:\d+(?:\s*[,;]\s*\d+)*)\])(?:\s*\[(?:\d+(?:\s*[,;]\s*\d+)*)\])*/g;
                var match;
                var cursor = 0;
                var fragment = document.createDocumentFragment();
                var changed = false;

                while ((match = pattern.exec(text))) {
                  var numbers = (match[0].match(/\d+/g) || []).filter(function (number, index, all) {
                    return all.indexOf(number) === index;
                  });
                  if (!numbers.length || numbers.some(function (number) { return !sources[number]; })) continue;

                  fragment.appendChild(document.createTextNode(text.slice(cursor, match.index)));
                  fragment.appendChild(makeCitationGroup(numbers, sources));
                  cursor = pattern.lastIndex;
                  changed = true;
                }

                if (!changed) return;
                fragment.appendChild(document.createTextNode(text.slice(cursor)));
                textNode.replaceWith(fragment);
              });
            }

            function isSourcesHeading(heading) {
              var text = heading.textContent.trim().toLowerCase().replace(/\s+/g, ' ');
              return text === 'sources and notes' ||
                text === 'sources & notes' ||
                text === 'notes and sources' ||
                text === 'sources' ||
                text === 'references';
            }

            function enhance() {
              scheduled = false;
              if (!document.body) return;
              var supported = document.body.classList.contains('cdd-article-page') ||
                document.body.classList.contains('cdd-print-layout');
              if (!supported) return;

              var article = document.querySelector('[data-cdd-body]');
              if (!article) return;
              if (article.dataset.cddCitationsEnhanced === VERSION) return;

              var headings = Array.from(article.querySelectorAll(':scope > h2'));
              var sourcesHeading = headings.find(isSourcesHeading);
              if (!sourcesHeading) return;

              var sources = collectSources(sourcesHeading);
              if (!Object.keys(sources).length) return;

              var node = article.firstElementChild;
              while (node && node !== sourcesHeading) {
                if (node.tagName !== 'H2') replaceCitationMarkers(node, sources);
                node = node.nextElementSibling;
              }

              article.dataset.cddCitationsEnhanced = VERSION;
            }

            function scheduleEnhance() {
              if (scheduled) return;
              scheduled = true;
              window.requestAnimationFrame(enhance);
            }

            function start() {
              installStyles();
              scheduleEnhance();

              if (!('MutationObserver' in window) || observer) return;
              observer = new MutationObserver(scheduleEnhance);
              observer.observe(document.body, { childList: true, subtree: true });
            }

            window.__cddEnhanceCitations = function () {
              installStyles();
              enhance();
            };

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', start, { once: true });
            } else {
              start();
            }
          })();
          '''
          Path('assets/js/cdd-citations.js').write_text(citations_js, encoding='utf-8')

          citations_css = r'''/* Standardized source references for ShoreVest Insights / China Debt Dynamics. */
          body.cdd-article-page .cdd-inline-citation,
          body.cdd-print-layout .cdd-inline-citation {
            display: inline;
            position: relative;
            top: -0.42em;
            margin-left: 0.07em;
            font-family: var(--sv-font, "DIN 2014", "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif);
            font-size: 0.66em;
            font-weight: 600;
            line-height: 0;
            vertical-align: baseline;
            white-space: nowrap;
            letter-spacing: 0;
          }

          body.cdd-article-page .cdd-inline-citation a,
          body.cdd-print-layout .cdd-inline-citation a {
            display: inline;
            padding: 0;
            border: 0;
            color: var(--sv-cinnabar, #C93B2A) !important;
            text-decoration: none !important;
          }

          body.cdd-article-page .cdd-inline-citation__separator,
          body.cdd-print-layout .cdd-inline-citation__separator {
            margin-right: 0.08em;
            color: currentColor;
          }

          body.cdd-article-page .cdd-inline-citation a:hover,
          body.cdd-article-page .cdd-inline-citation a:focus-visible,
          body.cdd-print-layout .cdd-inline-citation a:hover,
          body.cdd-print-layout .cdd-inline-citation a:focus-visible {
            color: var(--sv-cinnabar-d, #9F2F24) !important;
            text-decoration: underline !important;
            text-decoration-thickness: 1px !important;
            text-underline-offset: 0.14em;
            outline: none;
          }

          body.cdd-article-page .cdd-source-note,
          body.cdd-print-layout .cdd-source-note {
            scroll-margin-top: 96px;
            transition: background-color 220ms ease;
          }

          body.cdd-article-page .cdd-source-note:target {
            background: rgba(201, 59, 42, 0.07);
          }

          body.cdd-article-page .cdd-source-note__index,
          body.cdd-print-layout .cdd-source-note__index {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
          }

          body.cdd-article-page .cdd-source-note__copy a[data-cdd-source-url],
          body.cdd-print-layout .cdd-source-note__copy a[data-cdd-source-url] {
            display: inline-block;
            margin: 0 0.16em;
            border-bottom: 1px solid rgba(201, 59, 42, 0.38);
            color: var(--sv-cinnabar, #C93B2A) !important;
            font-weight: 600;
            text-decoration: none !important;
          }

          @media (max-width: 700px) {
            body.cdd-article-page .cdd-inline-citation {
              top: -0.38em;
              margin-left: 0.06em;
              font-size: 0.68em;
            }

            body.cdd-article-page .cdd-source-note {
              scroll-margin-top: 76px;
            }
          }

          @media print {
            body.cdd-print-layout .cdd-inline-citation,
            body.cdd-article-page .cdd-inline-citation {
              top: -0.38em;
              margin-left: 0.06em;
              font-size: 0.64em;
              font-weight: 500;
              color: inherit;
            }

            body.cdd-print-layout .cdd-inline-citation a,
            body.cdd-article-page .cdd-inline-citation a,
            body.cdd-print-layout .cdd-inline-citation__separator,
            body.cdd-article-page .cdd-inline-citation__separator {
              border: 0;
              color: inherit !important;
              text-decoration: none !important;
            }
          }
          '''
          Path('assets/css/cdd-citations.css').write_text(citations_css, encoding='utf-8')

          pager = Path('assets/js/cdd-issue-pager.js')
          text = pager.read_text(encoding='utf-8')
          text = re.sub(r'/assets/js/cdd-citations\.js\?v=[^\'\"]+', '/assets/js/cdd-citations.js?v=' + VERSION, text)
          pager.write_text(text, encoding='utf-8')

          template = Path('assets/js/cdd-article-template.js')
          text = template.read_text(encoding='utf-8')
          anchor = "  disclaimer.textContent = safeText(data.disclaimer);\n  copyright.textContent = safeText(data.copyright);\n\n  if (!isPrint) enhanceScreenLayout();"
          replacement = "  disclaimer.textContent = safeText(data.disclaimer);\n  copyright.textContent = safeText(data.copyright);\n\n  await ensureCitationEnhancer();\n\n  if (!isPrint) enhanceScreenLayout();"
          if 'await ensureCitationEnhancer();' not in text:
              if anchor not in text:
                  raise SystemExit('citation insertion anchor not found in cdd-article-template.js')
              text = text.replace(anchor, replacement, 1)

          if 'async function ensureCitationEnhancer()' not in text:
              fn_anchor = "\n\n  function issueHrefFromSource(src) {"
              fn = r'''

            async function ensureCitationEnhancer() {
              const citationVersion = '20260911-superscript-1';

              if (window.__CDD_CITATIONS_VERSION !== citationVersion ||
                  typeof window.__cddEnhanceCitations !== 'function') {
                await new Promise((resolve) => {
                  const script = document.createElement('script');
                  const raw = `/assets/js/cdd-citations.js?v=${citationVersion}`;
                  script.src = typeof window.__svTok === 'function' ? window.__svTok(raw) : raw;
                  script.async = false;
                  script.setAttribute('data-cdd-citations', citationVersion);
                  script.onload = resolve;
                  script.onerror = resolve;
                  document.head.appendChild(script);
                });
              }

              if (typeof window.__cddEnhanceCitations === 'function') {
                window.__cddEnhanceCitations();
              }

              const style = document.querySelector('link[data-cdd-citation-styles]');
              if (style && !style.sheet) {
                await new Promise((resolve) => {
                  style.addEventListener('load', resolve, { once: true });
                  style.addEventListener('error', resolve, { once: true });
                  setTimeout(resolve, 1500);
                });
              }

              await new Promise((resolve) => requestAnimationFrame(resolve));
            }
          '''
              if fn_anchor not in text:
                  raise SystemExit('function insertion anchor not found in cdd-article-template.js')
              text = text.replace(fn_anchor, fn + fn_anchor, 1)
          template.write_text(text, encoding='utf-8')

          # The secondary article enhancer used to leave [1] in the source list.
          secondary = Path('assets/js/insights-new-edition.js')
          text = secondary.read_text(encoding='utf-8')
          text = text.replace("index.textContent = '[' + match[1] + ']';", "index.textContent = match[1] + '.';")
          secondary.write_text(text, encoding='utf-8')

          # Cache-bust every current source and generated article route. This also
          # updates canonical templates so later clean-route regeneration keeps it.
          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = re.sub(r'cdd-article-template\.js(?:\?v=[^\"\'\s<]+)?',
                           'cdd-article-template.js?v=20260911-citations-1', text)
              new = re.sub(r'cdd-issue-pager\.js(?:\?v=[^\"\'\s<]+)?',
                           'cdd-issue-pager.js?v=20260911-citations-1', new)
              new = re.sub(r'insights-new-edition\.js(?:\?v=[^\"\'\s<]+)?',
                           'insights-new-edition.js?v=20260911-citations-1', new)
              if new != text:
                  path.write_text(new, encoding='utf-8')
          PY

      - name: Validate citation implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/cdd-citations.js
          node --check assets/js/cdd-article-template.js
          node --check assets/js/cdd-issue-pager.js
          node --check assets/js/insights-new-edition.js
          grep -Fq "link.textContent = source.number" assets/js/cdd-citations.js
          grep -Fq "await ensureCitationEnhancer();" assets/js/cdd-article-template.js
          grep -Fq "body.cdd-print-layout .cdd-inline-citation" assets/css/cdd-citations.css
          ! grep -Fq "link.textContent = '[' + source.number + ']'" assets/js/cdd-citations.js

      - name: Commit citation standardization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'shorevest-site-bot'
          git config user.email 'shorevest-site-bot@users.noreply.github.com'
          git add assets/js/cdd-citations.js assets/css/cdd-citations.css assets/js/cdd-issue-pager.js assets/js/cdd-article-template.js assets/js/insights-new-edition.js '*.html' insights
          git commit -m 'Standardize Insight superscript citations'
          git push origin HEAD:main
