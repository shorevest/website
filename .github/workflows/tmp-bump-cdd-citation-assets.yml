name: Temporary bump CDD citation assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip-citation-bump]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force fresh citation assets across Insights
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '20260911-references-4': '20260911-references-5',
              'cdd-article-template.js?v=20260911-citations-1': 'cdd-article-template.js?v=20260911-citations-2',
              'cdd-issue-pager.js?v=20260911-citations-1': 'cdd-issue-pager.js?v=20260911-citations-2',
              'cdd-article-template.js?v=20260911-print-figures-1': 'cdd-article-template.js?v=20260911-print-figures-2',
          }

          allowed = {'.html', '.js', '.css', '.cjs', '.mjs', '.json'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in allowed:
                  continue
              try:
                  old = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = old
              for before, after in replacements.items():
                  new = new.replace(before, after)
              if new != old:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(' -', item)
          if not changed:
              raise SystemExit('No files changed; expected version strings were not found.')
          PY
      - name: Commit version bump
        run: |
          git config user.name "shorevest-site-bot"
          git config user.email "site-bot@shorevest.com"
          git add -A
          git commit -m "Force fresh Insight citation styling [skip-citation-bump]"
          git push
