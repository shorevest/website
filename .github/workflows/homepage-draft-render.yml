name: Render ShoreVest homepage draft
on:
  push:
    branches: [design/impeccable-20260930]
    paths:
      - 'home.html'
      - 'index.html'
      - 'home_cn.html'
      - 'cn/index.html'
      - 'assets/css/homepage-editorial-draft.css'
      - 'scripts/render-homepage-draft.cjs'
      - '.github/workflows/homepage-draft-render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Render and verify both languages on desktop and mobile
        env:
          HOMEPAGE_BASE_SHA: 8a4ba67033f1bcd0bfd7ef58c5ab987ce9d64502
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/shorevest-homepage-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node scripts/render-homepage-draft.cjs
      - name: Save rendered draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorevest-homepage-draft
          path: artifacts/homepage-draft/
          retention-days: 7
          if-no-files-found: error
