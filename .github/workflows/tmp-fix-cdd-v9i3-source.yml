name: Canonical CDD v9i3 source repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-cdd-v9i3-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair canonical CDD sources and regenerate clean routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          version = '20260911-v9i3-fit-2'

          # Canonical print/PDF source. The clean URL generator copies this file,
          # so the repair must live here rather than only in the generated route.
          p = Path('china-debt-dynamics-print.html')
          text = p.read_text()
          anchor = '  <script>document.write(\'<link rel="stylesheet" href="assets/css/cdd-article-print.css?v=20260719-no-top-rule">\');</script>'
          includes = (
              f'  <script>document.write(\'<link rel="stylesheet" href="assets/css/cdd-article-figures.css?v={version}">\');</script>\n'
              f'  <script>document.write(\'<link rel="stylesheet" href="assets/css/cdd-v9i3-figure-fit.css?v={version}">\');</script>'
          )
          if 'cdd-v9i3-figure-fit.css' not in text:
              if anchor not in text:
                  raise SystemExit('print CSS anchor missing')
              text = text.replace(anchor, anchor + '\n' + includes, 1)
          else:
              import re
              text = re.sub(r'cdd-article-figures\.css\?v=[^"\']+', f'cdd-article-figures.css?v={version}', text)
              text = re.sub(r'cdd-v9i3-figure-fit\.css\?v=[^"\']+', f'cdd-v9i3-figure-fit.css?v={version}', text)

          body = '<body class="cdd-print-layout" data-auto-print="true" data-default-article-source="assets/data/china-debt-dynamics-v10i2.json">'
          hook = """<script>
          document.body.dataset.articleSource =
            (new URLSearchParams(location.search)).get('source') ||
            document.body.dataset.defaultArticleSource ||
            '';
          </script>"""
          if 'document.body.dataset.articleSource' not in text:
              if body not in text:
                  raise SystemExit('print body anchor missing')
              text = text.replace(body, body + '\n' + hook, 1)
          p.write_text(text)

          # Canonical v9i3 article source, for the same reason.
          p = Path('china-debt-dynamics-into-the-shadows-of-us-private-credit.html')
          text = p.read_text()
          anchor = '    <script>document.write(\'<link rel="stylesheet" href="assets/css/cdd-article-template.css?v=20260703-fullwidth">\');</script>'
          includes = (
              f'    <script>document.write(\'<link rel="stylesheet" href="assets/css/cdd-article-figures.css?v={version}">\');</script>\n'
              f'    <script>document.write(\'<link rel="stylesheet" href="assets/css/cdd-v9i3-figure-fit.css?v={version}">\');</script>'
          )
          if 'cdd-v9i3-figure-fit.css' not in text:
              if anchor not in text:
                  raise SystemExit('article CSS anchor missing')
              text = text.replace(anchor, anchor + '\n' + includes, 1)
          else:
              import re
              text = re.sub(r'cdd-article-figures\.css\?v=[^"\']+', f'cdd-article-figures.css?v={version}', text)
              text = re.sub(r'cdd-v9i3-figure-fit\.css\?v=[^"\']+', f'cdd-v9i3-figure-fit.css?v={version}', text)
          p.write_text(text)
          PY

          node scripts/run-normalize-public-site.cjs
          node scripts/normalize-cdd-publication.cjs
          node scripts/generate-clean-public-urls.js
          node scripts/normalize-current-page-fragments.cjs
          node scripts/add-insight-social-metadata.cjs
          node scripts/run-normalize-public-site.cjs --validate
          node scripts/add-insight-social-metadata.cjs --validate
          node scripts/normalize-favicons.cjs
          node scripts/normalize-favicons.cjs --validate

          grep -Fq 'cdd-v9i3-figure-fit.css?v=20260911-v9i3-fit-2' china-debt-dynamics-print.html
          grep -Fq 'cdd-v9i3-figure-fit.css?v=20260911-v9i3-fit-2' insights/china-debt-dynamics/print/index.html
          grep -Fq 'document.body.dataset.articleSource' china-debt-dynamics-print.html
          grep -Fq 'document.body.dataset.articleSource' insights/china-debt-dynamics/print/index.html
          grep -Fq 'cdd-v9i3-figure-fit.css?v=20260911-v9i3-fit-2' china-debt-dynamics-into-the-shadows-of-us-private-credit.html
          grep -Fq 'cdd-v9i3-figure-fit.css?v=20260911-v9i3-fit-2' insights/china-debt-dynamics/v9i3/index.html
          git diff --check

          rm .github/workflows/tmp-fix-cdd-v9i3-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make CDD v9i3 figure fix durable'
          git pull --rebase origin main
          git push origin main
