name: Final full Insights live audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-insights-final-live-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit live Insights end to end
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const path = require('path');

          const BASE = 'https://shorevest.com';
          const latestIssue = 'v10i3';
          const latestTitle = 'Perceptions Versus Reality in China Real Estate';
          const latestTitleCN = '中国房地产：认知与现实';
          const chrome = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!chrome) throw new Error('Chrome/Chromium not found');

          const issueRoot = path.join(process.cwd(),'insights','china-debt-dynamics');
          const issues = fs.readdirSync(issueRoot,{withFileTypes:true})
            .filter(x=>x.isDirectory() && /^v\d+i\d+$/i.test(x.name))
            .map(x=>x.name).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
          const failures=[];
          const warnings=[];
          const internal=new Set();
          const external=new Set();
          const badResponses=[];
          const fail=m=>{failures.push(m); console.error('FAIL',m)};
          const warn=m=>{warnings.push(m); console.warn('WARN',m)};
          const pass=m=>console.log('PASS',m);
          const withBust=(raw,label='qa')=>{const u=new URL(raw,BASE);u.searchParams.set('qa',`${Date.now()}-${label}-${Math.random().toString(36).slice(2)}`);return u.href};
          const clean=raw=>{const u=new URL(raw,BASE);u.searchParams.delete('qa');u.hash='';return u.href};

          function expectedVolumeIssue(issue){
            const m=issue.match(/^v(\d+)i(\d+)$/i); return m?`Volume ${m[1]} | Issue ${m[2]}`:'';
          }
          function domAudit(){
            const figures=[...document.querySelectorAll('.cdd-figure')].map((f,i)=>{
              const img=f.querySelector('img'); const fr=f.getBoundingClientRect(); const ir=img?.getBoundingClientRect();
              return {i,fw:fr.width,fl:fr.left,fr:fr.right,iw:ir?.width||0,il:ir?.left||0,ir:ir?.right||0,nw:img?.naturalWidth||0,nh:img?.naturalHeight||0,src:img?.currentSrc||img?.src||''};
            });
            return {
              vw:innerWidth, sw:document.documentElement.scrollWidth,
              title:document.title,
              h1:document.querySelector('h1')?.textContent.trim()||'',
              ready:document.body?.dataset?.cddReady||'',
              canonical:document.querySelector('link[rel="canonical"]')?.href||'',
              citations:[...document.querySelectorAll('.cdd-inline-citation')].map(x=>x.textContent.trim()),
              sourceIndexes:[...document.querySelectorAll('.cdd-source-note__index')].map(x=>x.textContent.trim()),
              figures,
              duplicateIds:(()=>{const a=[...document.querySelectorAll('[id]')].map(x=>x.id).filter(Boolean);return [...new Set(a.filter((x,i)=>a.indexOf(x)!==i))]})(),
              links:[...document.querySelectorAll('a[href]')].map(a=>a.href),
              pdf:document.querySelector('.cdd-actions a.cdd-btn--solid')?.getAttribute('href')||'',
              back:document.querySelector('.cdd-actions a.cdd-btn:not(.cdd-btn--solid)')?.getAttribute('href')||''
            };
          }
          async function forceFigures(page){
            await page.evaluate(async()=>{
              const imgs=[...document.querySelectorAll('.cdd-figure img')];
              imgs.forEach(img=>{img.loading='eager'});
              for(const img of imgs){
                img.scrollIntoView({block:'center'});
                await new Promise(r=>setTimeout(r,100));
                if(!img.complete) await new Promise(r=>{const done=()=>r();img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});setTimeout(done,3000)});
                try{await img.decode()}catch(_){ }
              }
              scrollTo(0,0);
            });
          }
          function validateArticle(label,audit,issue){
            if(audit.ready!=='true') fail(`${label}: renderer not ready`);
            if(audit.sw>audit.vw+3) fail(`${label}: horizontal overflow ${audit.sw}>${audit.vw}`);
            if(!audit.h1) fail(`${label}: missing H1`);
            if(!audit.canonical.endsWith(`/insights/china-debt-dynamics/${issue}/`)) fail(`${label}: wrong canonical ${audit.canonical}`);
            if(audit.duplicateIds.length) fail(`${label}: duplicate ids ${audit.duplicateIds.join(',')}`);
            if(audit.citations.some(x=>/[\[\]]/.test(x))) fail(`${label}: bracketed inline citation remains`);
            if(audit.sourceIndexes.some(x=>/[\[\]]/.test(x))) fail(`${label}: bracketed source index remains`);
            for(const f of audit.figures){
              if(f.nw<=0||f.nh<=0) fail(`${label}: figure ${f.i+1} failed to load ${f.src}`);
              if(f.il < f.fl-2 || f.ir > f.fr+2) fail(`${label}: figure ${f.i+1} clips/overflows its container`);
            }
            const expected=`source=assets/data/china-debt-dynamics-${issue}.json`;
            if(!audit.pdf.includes('/insights/china-debt-dynamics/print/')||!audit.pdf.includes(expected)||!audit.pdf.includes('pdf=1')) fail(`${label}: PDF action targets wrong source (${audit.pdf})`);
            if(audit.back!=='/insights/') fail(`${label}: Back to Insights is ${audit.back}`);
          }

          (async()=>{
            // Repository/source integrity.
            if(issues.length!==22) fail(`repository has ${issues.length} CDD issue routes, expected 22`); else pass('22 canonical CDD issue routes');
            for(const issue of issues){
              const jp=path.join(process.cwd(),'assets','data',`china-debt-dynamics-${issue}.json`);
              const hp=path.join(issueRoot,issue,'index.html');
              if(!fs.existsSync(jp)){fail(`${issue}: missing canonical JSON`);continue}
              if(!fs.existsSync(hp)) fail(`${issue}: missing canonical HTML`);
              try{
                const data=JSON.parse(fs.readFileSync(jp,'utf8'));
                if(data.volumeIssue!==expectedVolumeIssue(issue)) fail(`${issue}: JSON says ${data.volumeIssue}, expected ${expectedVolumeIssue(issue)}`);
                if(!data.title||!data.published||!Array.isArray(data.sections)) fail(`${issue}: incomplete JSON`);
                if(issue===latestIssue){
                  if(data.title!==latestTitle) fail(`${issue}: latest title mismatch`);
                  if(data.published!=='September 2026') fail(`${issue}: latest date is ${data.published}`);
                }
              }catch(e){fail(`${issue}: invalid JSON ${e.message}`)}
            }

            const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            await page.addInitScript(()=>{window.print=()=>{}});
            page.on('response',r=>{try{const u=new URL(r.url());if(u.origin===BASE&&r.status()>=400&&!/favicon/i.test(u.pathname))badResponses.push(`${r.status()} ${u.pathname}${u.search}`)}catch(_){}});

            // EN/CN archive and responsive state.
            for(const spec of [{path:'/insights/',label:'EN',title:latestTitle},{path:'/cn/insights/',label:'CN',title:latestTitleCN}]){
              for(const width of [1440,390]){
                await page.setViewportSize({width,height:width===390?844:1000});
                const r=await page.goto(withBust(BASE+spec.path,`${spec.label}-${width}`),{waitUntil:'networkidle',timeout:60000});
                if(!r||r.status()>=400){fail(`${spec.label} archive ${width}: HTTP ${r?.status()}`);continue}
                const a=await page.evaluate(()=>{
                  const rows=[...document.querySelectorAll('.cdd-arc__row')]; const first=rows[0];
                  return {vw:innerWidth,sw:document.documentElement.scrollWidth,count:document.querySelector('[data-cdd-arc-count]')?.textContent.trim()||'',rows:rows.length,uniq:new Set(rows.map(x=>x.dataset.href)).size,first:first?.dataset.href||'',firstTitle:first?.querySelector('.cdd-arc__row-title')?.textContent.trim()||'',heroTitle:document.querySelector('.cdd-hero__panel-title')?.textContent.trim()||'',hero:document.querySelector('.cdd-hero__panel-cta')?.getAttribute('href')||'',items:rows.map(row=>({route:row.dataset.href||'',read:row.querySelector('.cdd-arc__read')?.getAttribute('href')||'',pdf:row.querySelector('.cdd-arc__pdf')?.getAttribute('href')||''})),links:[...document.querySelectorAll('a[href]')].map(x=>x.href),images:[...document.images].map(x=>({src:x.currentSrc||x.src,ok:x.complete&&x.naturalWidth>0}))};
                });
                if(a.rows!==22||a.count!=='22'||a.uniq!==22) fail(`${spec.label} archive ${width}: count/uniqueness mismatch (${a.rows}/${a.count}/${a.uniq})`);
                if(!a.first.endsWith('/v10i3/')||!a.hero.endsWith('/v10i3/')) fail(`${spec.label} archive ${width}: v10i3 is not latest hero/first row`);
                if(!a.firstTitle.includes(spec.title)||!a.heroTitle.includes(spec.title)) fail(`${spec.label} archive ${width}: latest title mismatch`);
                if(a.sw>a.vw+3) fail(`${spec.label} archive ${width}: horizontal overflow`);
                if(a.images.some(x=>!x.ok)) fail(`${spec.label} archive ${width}: broken image`);
                for(const item of a.items){
                  const m=item.route.match(/\/(v\d+i\d+)\/$/); const issue=m?.[1];
                  if(!issue){fail(`${spec.label}: malformed row route ${item.route}`);continue}
                  if(item.read!==item.route) fail(`${spec.label}: Read link mismatch for ${issue}`);
                  if(!item.pdf.includes(`/insights/china-debt-dynamics/print/?source=assets/data/china-debt-dynamics-${issue}.json`)||!item.pdf.includes('pdf=1')) fail(`${spec.label}: PDF row mismatch for ${issue}: ${item.pdf}`);
                }
                a.links.filter(x=>{try{const u=new URL(x);return u.origin===BASE&&(u.pathname.startsWith('/insights')||u.pathname.startsWith('/cn/insights')||/^\/china-debt-dynamics-/i.test(u.pathname))}catch(_){return false}}).forEach(x=>internal.add(clean(x)));
                pass(`${spec.label} archive ${width}px`);
              }
            }

            // Every article in desktop/mobile, with lazy figures actually loaded before QA.
            for(const issue of issues){
              for(const width of [1440,390]){
                await page.setViewportSize({width,height:width===390?844:1000});
                const r=await page.goto(withBust(`${BASE}/insights/china-debt-dynamics/${issue}/`,`${issue}-${width}`),{waitUntil:'networkidle',timeout:60000});
                if(!r||r.status()>=400){fail(`${issue} ${width}: HTTP ${r?.status()}`);continue}
                await page.waitForFunction(()=>document.body?.dataset?.cddReady==='true',null,{timeout:30000});
                await forceFigures(page);
                const a=await page.evaluate(domAudit);
                validateArticle(`${issue} ${width}`,a,issue);
                if(issue===latestIssue){
                  if(!a.title.includes(latestTitle)||!a.h1.includes(latestTitle)) fail(`${issue}: new CDD title missing from article`);
                  if(a.citations.length!==7) fail(`${issue}: expected 7 rendered citations, found ${a.citations.length}`);
                }
                a.links.forEach(x=>{try{const u=new URL(x);if(u.origin===BASE&&(u.pathname.startsWith('/insights')||u.pathname.startsWith('/cn/insights')||/^\/china-debt-dynamics-/i.test(u.pathname)))internal.add(clean(x))}catch(_){}});
                const sourceLinks=await page.evaluate(()=>[...document.querySelectorAll('a[data-cdd-source-url]')].map(x=>x.href));
                sourceLinks.forEach(x=>external.add(x));
                pass(`${issue} article ${width}px`);
              }
            }

            // Every dynamic print route and an actual A4 PDF render.
            await page.setViewportSize({width:900,height:1200});
            for(const issue of issues){
              const src=`assets/data/china-debt-dynamics-${issue}.json`;
              const url=`${BASE}/insights/china-debt-dynamics/print/?source=${encodeURIComponent(src)}&pdf=1`;
              const r=await page.goto(withBust(url,`${issue}-print`),{waitUntil:'networkidle',timeout:60000});
              if(!r||r.status()>=400){fail(`${issue} print: HTTP ${r?.status()}`);continue}
              await page.waitForFunction(()=>document.body?.dataset?.cddReady==='true',null,{timeout:30000});
              await forceFigures(page);
              await page.emulateMedia({media:'print'});
              const a=await page.evaluate(domAudit);
              if(a.sw>a.vw+3) fail(`${issue} print: horizontal overflow`);
              if(a.citations.some(x=>/[\[\]]/.test(x))) fail(`${issue} print: bracketed citation`);
              for(const f of a.figures){if(f.nw<=0||f.il<f.fl-2||f.ir>f.fr+2)fail(`${issue} print: figure ${f.i+1} failed/clipped`)}
              const active=await page.evaluate(()=>document.body.dataset.articleSource||'');
              if(active!==src) fail(`${issue} print: source ${active}, expected ${src}`);
              const pdf=await page.pdf({format:'A4',printBackground:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
              if(pdf.length<10000) fail(`${issue} print: PDF too small (${pdf.length})`);
              if(issue===latestIssue&&(!a.h1.includes(latestTitle)||a.citations.length!==7)) fail(`${issue} print: latest CDD content/citations mismatch`);
              pass(`${issue} print/PDF ${pdf.length} bytes`);
              await page.emulateMedia({media:'screen'});
            }

            // All old-style issue URLs must exist (direct page or compatibility alias), never 404.
            for(const issue of issues){
              const url=`${BASE}/china-debt-dynamics-${issue}.html`;
              const r=await context.request.get(withBust(url,`${issue}-legacy`),{maxRedirects:10,timeout:30000,failOnStatusCode:false});
              if(r.status()>=400) fail(`${issue} legacy URL: HTTP ${r.status()}`);
            }
            pass('all 22 old-style CDD URLs return without 4xx/5xx');

            // All discovered same-origin Insights links must work.
            for(const raw of internal){
              const r=await context.request.get(raw,{maxRedirects:10,timeout:30000,failOnStatusCode:false});
              if(r.status()>=400) fail(`internal link HTTP ${r.status()}: ${raw}`);
            }
            pass(`${internal.size} unique internal Insights links checked`);

            // Citation source URLs: true dead links fail; bot/rate-limit blocks are warnings only.
            for(const raw of external){
              try{
                const r=await context.request.get(raw,{maxRedirects:10,timeout:30000,failOnStatusCode:false,headers:{'User-Agent':'Mozilla/5.0 ShoreVest QA'}});
                const s=r.status();
                if(s===404||s===410) fail(`dead source link ${s}: ${raw}`); else if(s>=400) warn(`source returned ${s}, likely access/bot policy: ${raw}`);
              }catch(e){warn(`source request failed: ${raw} (${e.message})`)}
            }
            pass(`${external.size} citation source URLs checked`);

            const bad=[...new Set(badResponses)]; if(bad.length) fail(`same-origin 4xx/5xx observed in browser: ${bad.slice(0,20).join(' | ')}`);
            await browser.close();
            console.log(`SUMMARY issues=${issues.length} internal=${internal.size} sources=${external.size} warnings=${warnings.length} failures=${failures.length}`);
            if(warnings.length) console.log('WARNINGS\n'+warnings.join('\n'));
            if(failures.length){console.error('FAILURES\n'+failures.join('\n'));process.exit(1)}
            console.log('PASS FINAL: entire live Insights section is clean, including v10i3 desktop/mobile/print/PDF.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
