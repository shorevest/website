name: Temporary Recruitment Test Defender Repair

# Repair the existing enabled test-account settings after the verified 500 GB
# readback mismatch. No new account, subscription plan or Function deployment.
on:
  push:
    branches: [main]
    paths: [.github/workflows/tmp-recruitment-test-defender-setup.yml]

permissions:
  id-token: write
  contents: read

concurrency:
  group: recruitment-test-infrastructure
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: 2a5392be-62d3-44ad-8581-0ab5966b4964
  AZURE_TENANT_ID: 768bd74c-6be4-4c55-b52d-33673e3b8700
  AZURE_SUBSCRIPTION_ID: 4146f1fc-590f-4ee4-a7b7-57f15c08c74e
  AZURE_RESOURCE_GROUP: rg-shorevest-recruitment-test-eastasia
  FUNCTION_APP: svrc26hk-recruit-fn-test
  CV_STORAGE_ACCOUNT: svrc26hkcvtest
  SCAN_TOPIC: svrc26hk-recruit-scan-test

jobs:
  setup:
    name: Repair existing test-account scanner settings
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: recruitment-test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact target and privacy containment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "$AZURE_SUBSCRIPTION_ID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$AZURE_TENANT_ID" ]]
          jq -e '.openRolesEnabled == false and .applicationsEnabled == false' \
            assets/data/recruitment/public-config.json >/dev/null
          curl --fail --silent --show-error \
            'https://shorevest.com/assets/data/recruitment/public-config.json' \
            | jq -e '.openRolesEnabled == false and .applicationsEnabled == false' >/dev/null

          settings="$(az functionapp config appsettings list \
            -g "$AZURE_RESOURCE_GROUP" -n "$FUNCTION_APP" -o json)"
          value() { jq -r --arg key "$1" '.[] | select(.name == $key) | .value' <<<"$settings"; }
          [[ "$(value RECRUITMENT_API_ENABLED)" == 'true' ]]
          [[ "$(value RECRUITMENT_CAPTURE_ONLY_MODE)" == 'true' ]]
          [[ "$(value RECRUITMENT_ENVIRONMENT)" == 'test' ]]
          [[ "$(value RECRUITMENT_UPLOAD_STORAGE_ACCOUNT_NAME)" == "$CV_STORAGE_ACCOUNT" ]]
          storage_url="$(value RECRUITMENT_STORAGE_ACCOUNT_URL)"
          [[ "${storage_url%/}" == "https://${CV_STORAGE_ACCOUNT}.blob.core.windows.net" ]]
          [[ "$(value RECRUITMENT_BOT_VERIFICATION_MODE)" == 'turnstile' ]]
          for key in \
            RECRUITMENT_OUTBOX_DELIVERY_ENABLED \
            RECRUITMENT_CANDIDATE_ACK_ENABLED \
            RECRUITMENT_TEAM_NOTIFICATION_ENABLED \
            RECRUITMENT_HR_ACCESS_ENABLED \
            RECRUITMENT_RETENTION_ENABLED \
            RECRUITMENT_RETENTION_DELETION_ENABLED; do
            [[ "$(value "$key")" == 'false' ]] || { echo "$key is not disabled." >&2; exit 1; }
          done

          az storage account show -g "$AZURE_RESOURCE_GROUP" -n "$CV_STORAGE_ACCOUNT" \
            --query '{id:id,location:location,allowBlobPublicAccess:allowBlobPublicAccess,allowSharedKeyAccess:allowSharedKeyAccess}' \
            -o json > "$RUNNER_TEMP/recruitment-storage-controls.json"
          jq -e '.location == "eastasia" and .allowBlobPublicAccess == false and .allowSharedKeyAccess == false' \
            "$RUNNER_TEMP/recruitment-storage-controls.json" >/dev/null
          for container in recruitment-quarantine recruitment-clean; do
            [[ "$(az storage container-rm show -g "$AZURE_RESOURCE_GROUP" \
              --storage-account "$CV_STORAGE_ACCOUNT" --name "$container" \
              --query publicAccess -o tsv)" == 'None' ]]
          done
          az functionapp function list -g "$AZURE_RESOURCE_GROUP" -n "$FUNCTION_APP" \
            --query '[].name' -o tsv | sed 's#^.*/##' | grep -qx defenderScanResult

          # Management-plane resource metadata only: never list candidate blobs or records.
          az resource list -g "$AZURE_RESOURCE_GROUP" \
            --query '[].{name:name,type:type,location:location}' -o json \
            > "$RUNNER_TEMP/recruitment-resource-inventory.json"
          jq -c '.[]' "$RUNNER_TEMP/recruitment-resource-inventory.json"

      - name: Correct the existing scanner at account scope
        shell: bash
        run: |
          set -euo pipefail
          storage_id="$(jq -r .id "$RUNNER_TEMP/recruitment-storage-controls.json")"
          settings_url="https://management.azure.com${storage_id}/providers/Microsoft.Security/defenderForStorageSettings/current?api-version=2025-07-01-preview"
          topic_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.EventGrid/topics/${SCAN_TOPIC}"
          az rest --method get --url "$settings_url" --query properties -o json \
            > "$RUNNER_TEMP/recruitment-defender-before.json"
          # Never turn on a previously disabled paid plan from this repair.
          jq -e '.isEnabled == true and .overrideSubscriptionLevelSettings == true and .malwareScanning.onUpload.isEnabled == true' \
            "$RUNNER_TEMP/recruitment-defender-before.json" >/dev/null
          jq -n --arg topic "$topic_id" '{properties: {
            isEnabled: true,
            overrideSubscriptionLevelSettings: true,
            sensitiveDataDiscovery: {isEnabled: false},
            malwareScanning: {
              automatedResponse: "None",
              blobScanResultsOptions: "None",
              onUpload: {isEnabled: true, capGBPerMonth: 1,
                filters: {excludeBlobsWithPrefix: ["recruitment-clean/"]}},
              scanResultsEventGridTopicResourceId: $topic
            }
          }}' > "$RUNNER_TEMP/recruitment-defender-request.json"
          # Official account-level REST contract. The only Azure write in this
          # workflow is to the exact existing Defender settings resource above.
          az rest --method put --url "$settings_url" \
            --body @"$RUNNER_TEMP/recruitment-defender-request.json" \
            --query properties -o json > "$RUNNER_TEMP/recruitment-defender-response.json"
          jq -c . "$RUNNER_TEMP/recruitment-defender-response.json"

      - name: Verify effective scanner and event destination
        run: |
          set -euo pipefail
          storage_id="$(jq -r .id "$RUNNER_TEMP/recruitment-storage-controls.json")"
          scanner_matches() {
            jq -e --arg topic "/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.EventGrid/topics/${SCAN_TOPIC}" '
              .isEnabled == true and .overrideSubscriptionLevelSettings == true and
              .sensitiveDataDiscovery.isEnabled == false and
              .malwareScanning.automatedResponse == "None" and
              .malwareScanning.blobScanResultsOptions == "None" and
              .malwareScanning.onUpload.isEnabled == true and
              .malwareScanning.onUpload.capGBPerMonth == 1 and
              .malwareScanning.onUpload.filters.excludeBlobsWithPrefix == ["recruitment-clean/"] and
              ((.malwareScanning.onUpload.filters.excludeBlobsWithSuffix // []) | length) == 0 and
              .malwareScanning.onUpload.filters.excludeBlobsLargerThan == null and
              .malwareScanning.scanResultsEventGridTopicResourceId == $topic and
              (.malwareScanning.operationStatus.code == null or .malwareScanning.operationStatus.code == "Succeeded")
            ' "$RUNNER_TEMP/recruitment-defender-effective.json" >/dev/null
          }
          # A successful PUT does not prove persistence. Require two successive
          # matching GETs and retain the mismatched response on failure.
          matched_reads=0
          for attempt in $(seq 1 12); do
            az rest --method get \
              --url "https://management.azure.com${storage_id}/providers/Microsoft.Security/defenderForStorageSettings/current?api-version=2025-07-01-preview" \
              --query properties -o json > "$RUNNER_TEMP/recruitment-defender-effective.json"
            if scanner_matches; then
              matched_reads=$((matched_reads + 1))
              if [[ "$matched_reads" == 2 ]]; then break; fi
            else
              matched_reads=0
            fi
            sleep 5
          done
          jq -c . "$RUNNER_TEMP/recruitment-defender-effective.json"
          [[ "$matched_reads" == 2 ]] || { echo 'Effective scanner controls still differ; keep candidate capture disabled.' >&2; exit 1; }
          topic_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.EventGrid/topics/${SCAN_TOPIC}"
          az eventgrid event-subscription show --source-resource-id "$topic_id" \
            --name defender-malware-results \
            --query '{state:provisioningState,destination:destination,filter:filter}' -o json \
            > "$RUNNER_TEMP/recruitment-scan-delivery.json"
          jq -e --arg target "/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Web/sites/${FUNCTION_APP}/functions/defenderScanResult" '
            .state == "Succeeded" and .destination.endpointType == "AzureFunction" and
            .destination.resourceId == $target and
            .filter.includedEventTypes == ["Microsoft.Security.MalwareScanningResult"]
          ' "$RUNNER_TEMP/recruitment-scan-delivery.json" >/dev/null

      - name: Preserve non-sensitive setup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-defender-setup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recruitment-storage-controls.json
            ${{ runner.temp }}/recruitment-resource-inventory.json
            ${{ runner.temp }}/recruitment-defender-before.json
            ${{ runner.temp }}/recruitment-defender-request.json
            ${{ runner.temp }}/recruitment-defender-response.json
            ${{ runner.temp }}/recruitment-defender-effective.json
            ${{ runner.temp }}/recruitment-scan-delivery.json
          if-no-files-found: warn
          retention-days: 30
