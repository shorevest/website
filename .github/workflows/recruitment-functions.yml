name: Recruitment Functions CI

on:
  pull_request:
    paths:
      - '.github/workflows/recruitment-functions.yml'
      - '.github/workflows/tmp-recruitment-test-defender-setup.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/validate-recruitment-roles.js'
      - 'scripts/generate-clean-public-urls.js'
      - 'services/recruitment-functions/**'
      - 'api/recruitment/**'
      - 'infra/recruitment/**'
      - 'assets/data/recruitment/**'
      - 'assets/js/recruitment-*.js'
      - 'assets/js/site-config.js'
      - 'assets/css/recruitment-application.css'
      - 'careers.html'
      - 'careers_cn.html'
      - 'careers/**'
      - 'cn/careers/**'
      - 'sitemap.xml'
      - '_headers'
      - 'tests/recruitment*.test.js'
      - 'tests/security-headers.test.js'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install recruitment function dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/recruitment-functions
      - run: npm run validate:recruitment
      - run: npm run check:recruitment
      - run: npm run test:recruitment
      - run: npm run check:security
      - run: npm run check:functions
      - run: npm run test:functions
      - name: Build and verify immutable Function package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'recruitment-functions.zip'
          ./services/recruitment-functions/scripts/package.ps1 -CommitSha '${{ github.sha }}' -OutputPath $archive
          $sidecar = (Get-Content -LiteralPath "$archive.sha256" -Raw).Trim().Split(' ')[0]
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sidecar -ne $actual) {
            throw 'Archive digest sidecar does not match the generated ZIP.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\\', '/') })
            foreach ($required in @(
              'deployment-metadata.json',
              'services/recruitment-functions/node_modules/@azure/functions/package.json',
              'services/recruitment-functions/src/functions/index.js'
            )) {
              if ($required -notin $entries) { throw "Package is missing $required" }
            }
          } finally {
            $zip.Dispose()
          }
      - name: Compile recruitment Bicep
        run: npm run bicep:build:recruitment
      - name: Lint recruitment Bicep
        run: npm run bicep:lint:recruitment
      - run: git diff --check
