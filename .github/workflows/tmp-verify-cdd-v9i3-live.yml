name: Verify live CDD v9i3 layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verify-cdd-v9i3-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for repaired live Pages content
        shell: bash
        run: |
          set -euo pipefail
          url="https://shorevest.com/insights/china-debt-dynamics/print/?source=assets/data/china-debt-dynamics-v9i3.json&t=${GITHUB_SHA}"
          for i in $(seq 1 24); do
            html="$(curl -fsSL --retry 2 --connect-timeout 10 "$url" || true)"
            if printf '%s' "$html" | grep -Fq 'cdd-v9i3-figure-fit.css?v=20260911-v9i3-fit-2' && \
               printf '%s' "$html" | grep -Fq 'cdd-article-template.js?v=20260911-print-figures-1'; then
              echo "Live print route is serving the durable layout and renderer repairs."
              exit 0
            fi
            echo "Attempt $i: waiting for updated Pages content..."
            sleep 10
          done
          echo "Timed out waiting for repaired live print route." >&2
          exit 1
      - name: Measure all live figures in screen and print media
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const candidates = [
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser'
          ];
          const executablePath = candidates.find(fs.existsSync);
          if (!executablePath) throw new Error('No Chrome/Chromium executable found on runner');

          function validate(label, m) {
            console.log(`${label}:\n${JSON.stringify(m, null, 2)}`);
            const tol = 1.5;
            const failures = [];
            if (!String(m.source || '').includes('china-debt-dynamics-v9i3')) failures.push(`wrong article source: ${m.source}`);
            if (m.figures.length !== 5) failures.push(`expected 5 figures, found ${m.figures.length}`);
            for (const f of m.figures) {
              const tag = `figure ${f.index + 1} (${f.src.split('/').pop()})`;
              if (f.loading !== 'eager') failures.push(`${tag} loading is ${f.loading}`);
              if (f.figure.left < m.body.left - tol) failures.push(`${tag} overruns body left by ${(m.body.left - f.figure.left).toFixed(2)}px`);
              if (f.figure.right > m.body.right + tol) failures.push(`${tag} overruns body right by ${(f.figure.right - m.body.right).toFixed(2)}px`);
              if (f.figure.left < m.shell.left - tol) failures.push(`${tag} overruns shell left`);
              if (f.figure.right > m.shell.right + tol) failures.push(`${tag} overruns shell right`);
              if (f.image.left < f.media.left - tol) failures.push(`${tag} image overruns media left by ${(f.media.left - f.image.left).toFixed(2)}px`);
              if (f.image.right > f.media.right + tol) failures.push(`${tag} image overruns media right by ${(f.image.right - f.media.right).toFixed(2)}px`);
              if (f.image.width > f.media.width + tol) failures.push(`${tag} image wider than media by ${(f.image.width - f.media.width).toFixed(2)}px`);
              if (f.figureBoxSizing !== 'border-box') failures.push(`${tag} figure box-sizing is ${f.figureBoxSizing}`);
              if (f.imageObjectFit !== 'contain') failures.push(`${tag} image object-fit is ${f.imageObjectFit}`);
              if (!(f.naturalWidth > 0 && f.naturalHeight > 0)) failures.push(`${tag} failed to load`);
            }
            if (failures.length) throw new Error(`${label}: ${failures.join('; ')}`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath, args: ['--no-sandbox'] });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

            // The production template auto-opens print. Suppress only that browser
            // dialog in the verifier; print CSS is tested with emulateMedia below.
            await page.addInitScript(() => { window.print = () => {}; });

            const url = `https://shorevest.com/insights/china-debt-dynamics/print/?source=assets/data/china-debt-dynamics-v9i3.json&t=${process.env.GITHUB_SHA}`;
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const imgs = [...document.querySelectorAll('.cdd-figure img')];
              return imgs.length === 5 && imgs.every(img => img.loading === 'eager' && img.complete && img.naturalWidth > 0);
            }, null, { timeout: 60000 });
            await page.evaluate(async () => {
              await Promise.all([...document.querySelectorAll('.cdd-figure img')].map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve()));
            });

            const measure = () => page.evaluate(() => {
              const shell = document.querySelector('.cdd-print-shell');
              const body = document.querySelector('.cdd-body');
              if (!shell || !body) throw new Error('Required live layout nodes missing');
              const rect = el => {
                const r = el.getBoundingClientRect();
                return { left: r.left, right: r.right, width: r.width, top: r.top, bottom: r.bottom, height: r.height };
              };
              const figures = [...document.querySelectorAll('.cdd-figure')].map((figure, index) => {
                const media = figure.querySelector('.cdd-figure__media') || figure;
                const img = figure.querySelector('img');
                if (!img) throw new Error(`Figure ${index + 1} has no image`);
                return {
                  index,
                  src: img.currentSrc || img.src || '',
                  loading: img.loading,
                  figure: rect(figure),
                  media: rect(media),
                  image: rect(img),
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  figureBoxSizing: getComputedStyle(figure).boxSizing,
                  imageObjectFit: getComputedStyle(img).objectFit,
                  imageMaxWidth: getComputedStyle(img).maxWidth
                };
              });
              return {
                source: document.body.dataset.articleSource,
                viewportWidth: innerWidth,
                shell: rect(shell),
                body: rect(body),
                figures
              };
            });

            validate('SCREEN', await measure());
            await page.emulateMedia({ media: 'print' });
            validate('PRINT', await measure());
            console.log('PASS: all 5 live v9i3 figures are eager-loaded and contained in both screen preview and print media.');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
