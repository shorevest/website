name: Canonicalize Insight reference system

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-canonicalize-insight-references.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate reference styling and logic
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          # Reference presentation is owned solely by cdd-citations.css.
          p = Path('assets/css/cdd-article-figures.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Sources read as a reference ledger rather than another prose section. */'
          start = s.find(marker)
          end = s.find('@media (min-width: 701px)', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate legacy source-ledger CSS block')
          s = s[:start] + s[end:]

          # Remove the legacy mobile source geometry from the figure stylesheet.
          s, n1 = re.subn(
              r'\n  body\.cdd-article-page \.cdd-body > h2\.cdd-sources-heading \{\n'
              r'    margin-top: 64px;\n    margin-bottom: 22px;\n  \}\n',
              '\n', s, count=1)
          s, n2 = re.subn(
              r'\n  body\.cdd-article-page \.cdd-body > ul\.cdd-sources-list > li\.cdd-source-note,\n'
              r'  body\.cdd-article-page \.cdd-body > ol\.cdd-sources-list > li\.cdd-source-note,\n'
              r'  body\.cdd-article-page \.cdd-body > p\.cdd-source-note \{\n'
              r'    grid-template-columns: 38px minmax\(0, 1fr\);\n'
              r'    column-gap: 10px;\n'
              r'    padding: 14px 0 15px;\n'
              r'    font-size: 13px;\n'
              r'    line-height: 1\.58;\n  \}\n',
              '\n', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Expected one mobile reference block each, got {n1}, {n2}')
          if 'cdd-source-note' in s or 'cdd-sources-heading' in s or 'cdd-sources-list' in s:
              raise SystemExit('Reference selectors remain in cdd-article-figures.css')
          p.write_text(s, encoding='utf-8')

          # Structural citation/reference enhancement is owned solely by cdd-citations.js.
          p = Path('assets/js/insights-new-edition.js')
          s = p.read_text(encoding='utf-8')
          s, n3 = re.subn(
              r'\n  function upgradeSourceEntry\(entry\) \{.*?\n  \}\n\n  function enhanceCddStructure\(\) \{',
              '\n  function enhanceCddStructure() {', s, count=1, flags=re.S)
          if n3 != 1:
              raise SystemExit('Could not remove duplicate upgradeSourceEntry')
          s, n4 = re.subn(
              r'\n    var sourcesHeading = headings\.find\(function \(heading\) \{.*?\n    \}\n  \}',
              '\n  }', s, count=1, flags=re.S)
          if n4 != 1:
              raise SystemExit('Could not remove duplicate source enhancement from enhanceCddStructure')
          if 'upgradeSourceEntry' in s or "classList.add('cdd-sources-heading')" in s:
              raise SystemExit('Duplicate source enhancement remains in insights-new-edition.js')
          p.write_text(s, encoding='utf-8')

          # Force the canonical stylesheet/enhancer to refresh everywhere.
          old = '20260911-references-3'
          new = '20260911-references-4'
          for name in ['assets/js/cdd-citations.js','assets/js/cdd-issue-pager.js','assets/js/cdd-article-template.js']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{old} not found in {name}')
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/cdd-article-figures.css assets/js/insights-new-edition.js assets/js/cdd-citations.js assets/js/cdd-issue-pager.js assets/js/cdd-article-template.js
          git commit -m 'Centralize Insight reference styling and behavior'
          git push origin HEAD:main

# One-time migration to make cdd-citations the sole reference system.
