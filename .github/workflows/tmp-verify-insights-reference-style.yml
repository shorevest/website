name: Verify live Insight reference style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verify-insights-reference-style.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reference treatment on live site
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mkdir -p qa-reference-style
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const expectedVersion = '20260911-references-2';
          const base = 'https://shorevest.com';
          const chrome = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!chrome) throw new Error('Chrome/Chromium not found');

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const fail = msg => { throw new Error(msg); };

          async function waitForDeployment(page) {
            const deadline = Date.now() + 5 * 60 * 1000;
            while (Date.now() < deadline) {
              const url = `${base}/insights/china-debt-dynamics/v9i3/?qa=${Date.now()}`;
              await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
              await page.waitForFunction(() => document.body?.dataset?.cddReady === 'true', null, {timeout:30000}).catch(()=>{});
              const version = await page.evaluate(() => window.__CDD_CITATIONS_VERSION || '');
              if (version === expectedVersion) return;
              console.log(`Waiting for Pages deployment; live citation version is ${version || '(none)'}`);
              await sleep(15000);
            }
            fail('Timed out waiting for reference style deployment');
          }

          async function audit(page, issue, mode, width) {
            const source = `assets/data/china-debt-dynamics-${issue}.json`;
            const url = mode === 'print'
              ? `${base}/insights/china-debt-dynamics/print/?source=${encodeURIComponent(source)}&qa=${Date.now()}`
              : `${base}/insights/china-debt-dynamics/${issue}/?qa=${Date.now()}`;
            await page.setViewportSize({width, height: mode === 'print' ? 1200 : (width < 600 ? 844 : 1000)});
            await page.emulateMedia({media: mode === 'print' ? 'print' : 'screen'});
            const r = await page.goto(url, {waitUntil:'networkidle', timeout:60000});
            if (!r || r.status() >= 400) fail(`${issue} ${mode}: HTTP ${r?.status()}`);
            await page.waitForFunction(() => document.body?.dataset?.cddReady === 'true', null, {timeout:30000});
            await page.waitForFunction(() => document.querySelector('.cdd-sources-heading') || !document.querySelector('[data-cdd-body] h2'), null, {timeout:10000});

            const result = await page.evaluate(() => {
              const heading = document.querySelector('.cdd-sources-heading');
              const notes = [...document.querySelectorAll('.cdd-source-note')];
              const first = notes[0];
              const idx = first?.querySelector('.cdd-source-note__index');
              const copy = first?.querySelector('.cdd-source-note__copy');
              const pseudo = first ? getComputedStyle(first, '::before') : null;
              const firstStyle = first ? getComputedStyle(first) : null;
              const hStyle = heading ? getComputedStyle(heading) : null;
              const idxStyle = idx ? getComputedStyle(idx) : null;
              const copyStyle = copy ? getComputedStyle(copy) : null;
              const ir = idx?.getBoundingClientRect();
              const cr = copy?.getBoundingClientRect();
              return {
                version: window.__CDD_CITATIONS_VERSION || '',
                heading: heading?.textContent.trim() || '',
                headingFontSize: hStyle?.fontSize || '',
                noteCount: notes.length,
                display: firstStyle?.display || '',
                gridColumns: firstStyle?.gridTemplateColumns || '',
                columnGap: firstStyle?.columnGap || '',
                fontSize: firstStyle?.fontSize || '',
                lineHeight: firstStyle?.lineHeight || '',
                breakInside: firstStyle?.breakInside || '',
                pageBreakInside: firstStyle?.pageBreakInside || '',
                pseudoContent: pseudo?.content || '',
                pseudoDisplay: pseudo?.display || '',
                pseudoBg: pseudo?.backgroundColor || '',
                indexText: idx?.textContent.trim() || '',
                indexColor: idxStyle?.color || '',
                copyText: copy?.textContent.trim().slice(0,120) || '',
                indexRight: ir?.right || 0,
                copyLeft: cr?.left || 0,
                citationTexts: [...document.querySelectorAll('.cdd-inline-citation')].map(x=>x.textContent.trim()),
                sourceIndexTexts: [...document.querySelectorAll('.cdd-source-note__index')].map(x=>x.textContent.trim()),
                scrollWidth: document.documentElement.scrollWidth,
                innerWidth: innerWidth
              };
            });

            console.log(`${issue} ${mode} ${width}px`, JSON.stringify(result, null, 2));
            if (result.version !== expectedVersion) fail(`${issue} ${mode}: wrong citation version ${result.version}`);
            if (result.noteCount) {
              if (result.display !== 'grid') fail(`${issue} ${mode}: reference note is not grid`);
              if (!(result.copyLeft > result.indexRight)) fail(`${issue} ${mode}: number/copy gap collapsed`);
              if (result.pseudoDisplay !== 'none' && result.pseudoContent !== 'none' && result.pseudoContent !== 'normal') fail(`${issue} ${mode}: generic bullet pseudo-element still visible`);
              if (result.sourceIndexTexts.some(t => /[\[\]]/.test(t))) fail(`${issue} ${mode}: bracketed source number remains`);
              if (result.citationTexts.some(t => /[\[\]]/.test(t))) fail(`${issue} ${mode}: bracketed inline citation remains`);
              if (mode === 'print' && !['avoid','avoid-page'].includes(result.breakInside)) fail(`${issue} print: source note can split across pages (${result.breakInside})`);
            }
            if (result.scrollWidth > result.innerWidth + 3) fail(`${issue} ${mode}: horizontal overflow`);

            if (result.noteCount) {
              await page.locator('.cdd-sources-heading').scrollIntoViewIfNeeded();
              await page.screenshot({path:`qa-reference-style/${issue}-${mode}-${width}.png`, fullPage:false});
            }
            if (mode === 'print') {
              const pdf = await page.pdf({path:`qa-reference-style/${issue}.pdf`, format:'A4', printBackground:true, margin:{top:'0',right:'0',bottom:'0',left:'0'}});
              if (pdf.length < 10000) fail(`${issue}: generated PDF unexpectedly small`);
            }
            return result;
          }

          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath:chrome, args:['--no-sandbox']});
            const page = await browser.newPage();
            await page.addInitScript(() => { window.print = () => {}; });
            await waitForDeployment(page);

            for (const issue of ['v9i3','v10i3']) {
              await audit(page, issue, 'screen', 1440);
              await audit(page, issue, 'screen', 390);
              await audit(page, issue, 'print', 900);
            }

            // Archive-wide structural check: every issue that has numbered source notes
            // must receive the same shared reference classes and no generic bullet marker.
            const issues = fs.readdirSync('insights/china-debt-dynamics', {withFileTypes:true})
              .filter(d => d.isDirectory() && /^v\d+i\d+$/i.test(d.name))
              .map(d => d.name);
            let styledIssues = 0;
            for (const issue of issues) {
              await page.emulateMedia({media:'screen'});
              await page.setViewportSize({width:1200,height:900});
              await page.goto(`${base}/insights/china-debt-dynamics/${issue}/?qa=${Date.now()}-${issue}`, {waitUntil:'networkidle', timeout:60000});
              await page.waitForFunction(() => document.body?.dataset?.cddReady === 'true', null, {timeout:30000});
              const a = await page.evaluate(() => {
                const notes=[...document.querySelectorAll('.cdd-source-note')];
                return {
                  notes:notes.length,
                  bad:notes.filter(n => {
                    const s=getComputedStyle(n); const p=getComputedStyle(n,'::before');
                    return s.display !== 'grid' || (p.display !== 'none' && p.content !== 'none' && p.content !== 'normal');
                  }).length,
                  bracketed:[...document.querySelectorAll('.cdd-source-note__index')].some(x=>/[\[\]]/.test(x.textContent))
                };
              });
              if (a.notes) styledIssues++;
              if (a.bad || a.bracketed) fail(`${issue}: archive-wide reference styling failed ${JSON.stringify(a)}`);
            }
            console.log(`PASS: ${styledIssues} issue(s) with numbered reference sections use the shared standardized treatment across the 22-issue archive.`);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insight-reference-style-qa
          path: qa-reference-style
          if-no-files-found: ignore
